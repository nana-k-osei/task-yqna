<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimplePOS – Transaction Detail</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="logo">
          <span class="logo-name">SimplePOS</span>
          <span class="logo-merchant merchant-name">Loading...</span>
        </div>
      </header>

      <main class="app-main">
        <div>
          <a href="transactions.html" class="back-btn">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="15 18 9 12 15 6" />
            </svg>
            Transactions
          </a>
          <p class="page-title">Transaction Detail</p>
        </div>

        <div
          id="loadingState"
          style="display: flex; justify-content: center; padding: 40px 0"
        >
          <div class="spinner"></div>
        </div>

        <div
          id="content"
          style="display: none; flex-direction: column; gap: 16px"
        >
          <!-- Amount hero -->
          <div class="amount-display" id="amountHero">
            <div>
              <span class="currency-symbol">£</span
              ><span class="amount-value" id="heroAmount">0.00</span>
            </div>
            <p class="amount-label" id="heroStatus">—</p>
          </div>

          <!-- Details card -->
          <div class="card">
            <div class="detail-row">
              <span class="detail-label">Reference</span>
              <span class="detail-value" id="detailRef">—</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Payment Method</span>
              <span class="detail-value" id="detailMethod">—</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Date &amp; Time</span>
              <span class="detail-value" id="detailDatetime">—</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Status</span>
              <span id="detailStatus">—</span>
            </div>
            <div class="detail-row" id="failureRow" style="display: none">
              <span class="detail-label">Failure Reason</span>
              <span
                class="detail-value"
                style="color: var(--red)"
                id="detailFailure"
                >—</span
              >
            </div>
          </div>

          <!-- Refund section -->
          <div
            id="refundSection"
            style="display: none; flex-direction: column; gap: 10px"
          >
            <div id="refundError" class="inline-error">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
              <span id="refundErrorMsg"></span>
            </div>
            <button class="btn btn-danger" id="refundBtn">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="1 4 1 10 7 10" />
                <path d="M3.51 15a9 9 0 1 0 .49-3.35" />
              </svg>
              Refund This Transaction
            </button>
          </div>
        </div>

        <div id="errorState" style="display: none">
          <div class="empty-state">
            <svg
              width="48"
              height="48"
              viewBox="0 0 24 24"
              fill="none"
              stroke="var(--red)"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="8" x2="12" y2="12" />
              <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            <p>Transaction not found</p>
            <a
              href="transactions.html"
              class="btn btn-secondary"
              style="margin-top: 8px; width: auto; padding: 12px 24px"
              >Go Back</a
            >
          </div>
        </div>
      </main>
    </div>

    <!-- Refund Confirmation Modal -->
    <div id="refundModal" class="modal" style="display: none">
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <div class="modal-header">
          <p class="modal-title">Confirm Refund</p>
        </div>
        <div class="modal-body">
          <p>
            Are you sure you want to refund
            <span id="modalAmount" class="modal-amount">£0.00</span> to the
            customer?
          </p>
          <p style="font-size: 13px; color: var(--muted); margin-top: 8px">
            This action cannot be undone.
          </p>
        </div>
        <div class="modal-footer">
          <button id="modalCancelBtn" class="btn btn-secondary">Cancel</button>
          <button id="modalConfirmBtn" class="btn btn-primary">
            Confirm Refund
          </button>
        </div>
      </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const txnId = params.get("id");

      if (!txnId) {
        window.location.href = "transactions.html";
      }

      const badgeFor = (status) => {
        if (status === "success")
          return `<span class="badge badge-success">✓ Approved</span>`;
        if (status === "refunded")
          return `<span class="badge badge-refunded">↩ Refunded</span>`;
        return `<span class="badge badge-failed">✕ Failed</span>`;
      };

      function renderTransaction(txn) {
        document.getElementById("loadingState").style.display = "none";
        const content = document.getElementById("content");
        content.style.display = "flex";

        const amountStr = txn.amount.toFixed(2);
        document.getElementById("heroAmount").textContent = amountStr;
        document.getElementById("heroStatus").textContent =
          txn.status.toUpperCase();
        document.getElementById("detailRef").textContent = txn.reference;
        document.getElementById("detailMethod").textContent =
          txn.payment_method === "card" ? "Debit Card" : "QR Code";
        document.getElementById("detailDatetime").textContent = formatDateTime(
          txn.timestamp,
        );
        document.getElementById("detailStatus").innerHTML = badgeFor(
          txn.status,
        );

        if (txn.status === "failed" && txn.failure_reason) {
          document.getElementById("failureRow").style.display = "flex";
          document.getElementById("detailFailure").textContent =
            txn.failure_reason;
        }

        // Show refund button only for successful (not yet refunded) transactions
        if (txn.status === "success") {
          const refundSection = document.getElementById("refundSection");
          refundSection.style.display = "flex";

          document.getElementById("refundBtn").addEventListener("click", () => {
            document.getElementById("modalAmount").textContent = formatAmount(
              txn.amount,
            );
            document.getElementById("refundModal").style.display = "flex";
          });

          document
            .getElementById("modalCancelBtn")
            .addEventListener("click", () => {
              document.getElementById("refundModal").style.display = "none";
            });

          document
            .getElementById("modalConfirmBtn")
            .addEventListener("click", async () => {
              const btn = document.getElementById("refundBtn");
              const confirmBtn = document.getElementById("modalConfirmBtn");
              confirmBtn.disabled = true;
              confirmBtn.textContent = "Processing...";
              btn.disabled = true;

              try {
                const updated = await api.refundTransaction(txn.id);
                document.getElementById("refundModal").style.display = "none";
                // Re-render with updated transaction
                renderTransaction(updated);
              } catch (err) {
                document.getElementById("refundErrorMsg").textContent =
                  err.message || "Refund failed. Please try again.";
                document.getElementById("refundError").classList.add("visible");
                confirmBtn.disabled = false;
                confirmBtn.textContent = "Confirm Refund";
                btn.disabled = false;
              }
            });

          // Close modal when clicking overlay
          document
            .getElementById("refundModal")
            .addEventListener("click", (e) => {
              if (e.target.id === "refundModal") {
                document.getElementById("refundModal").style.display = "none";
              }
            });
        }
      }

      async function loadTransaction() {
        try {
          const txn = await api.getTransaction(txnId);
          renderTransaction(txn);
        } catch {
          document.getElementById("loadingState").style.display = "none";
          document.getElementById("errorState").style.display = "block";
        }
      }

      loadTransaction();
    </script>
  </body>
</html>
