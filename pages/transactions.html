<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimplePOS – Transactions</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="logo">
          <span class="logo-name">SimplePOS</span>
          <span class="logo-merchant merchant-name">Loading...</span>
        </div>
        <div class="header-actions">
          <a href="../index.html" class="icon-btn" data-label="New Payment">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          </a>
          <button
            id="logoutBtn"
            class="icon-btn"
            data-label="Logout"
            type="button"
            title="Logout"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 8 20 12 16 16" />
              <line x1="9" y1="12" x2="20" y2="12" />
            </svg>
          </button>
        </div>
      </header>

      <main class="app-main">
        <div>
          <p class="page-title">Transactions</p>
          <p class="page-subtitle">All payments processed today</p>
        </div>

        <!-- Filters Section -->
        <div class="filters-card">
          <div class="filter-row">
            <div class="filter-group">
              <label for="searchRef" class="filter-label">Reference</label>
              <input
                type="text"
                id="searchRef"
                placeholder="Search TXN-..."
                class="filter-input"
              />
            </div>
          </div>
          <div class="filter-row">
            <div class="filter-group">
              <label for="dateFrom" class="filter-label">From</label>
              <input type="date" id="dateFrom" class="filter-input" />
            </div>
            <div class="filter-group">
              <label for="dateTo" class="filter-label">To</label>
              <input type="date" id="dateTo" class="filter-input" />
            </div>
            <button
              id="resetBtn"
              class="btn btn-secondary"
              style="align-self: flex-end; padding: 10px 16px; font-size: 13px"
            >
              Reset
            </button>
          </div>
        </div>

        <!-- Summary strip -->
        <div
          style="
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 10px;
          "
          id="summaryStrip"
        >
          <div class="card-flat" style="text-align: center; padding: 16px 10px">
            <p
              style="
                font-family: &quot;Syne&quot;, sans-serif;
                font-size: 20px;
                font-weight: 800;
                color: var(--navy);
              "
              id="totalCount"
            >
              —
            </p>
            <p style="font-size: 11px; color: var(--muted); margin-top: 3px">
              Total
            </p>
          </div>
          <div class="card-flat" style="text-align: center; padding: 16px 10px">
            <p
              style="
                font-family: &quot;Syne&quot;, sans-serif;
                font-size: 20px;
                font-weight: 800;
                color: var(--green);
              "
              id="approvedCount"
            >
              —
            </p>
            <p style="font-size: 11px; color: var(--muted); margin-top: 3px">
              Approved
            </p>
          </div>
          <div class="card-flat" style="text-align: center; padding: 16px 10px">
            <p
              style="
                font-family: &quot;Syne&quot;, sans-serif;
                font-size: 20px;
                font-weight: 800;
                color: var(--muted);
              "
              id="refundedCount"
            >
              —
            </p>
            <p style="font-size: 11px; color: var(--muted); margin-top: 3px">
              Refunded
            </p>
          </div>
          <div class="card-flat" style="text-align: center; padding: 16px 10px">
            <p
              style="
                font-family: &quot;Syne&quot;, sans-serif;
                font-size: 20px;
                font-weight: 800;
                color: var(--red);
              "
              id="failedCount"
            >
              —
            </p>
            <p style="font-size: 11px; color: var(--muted); margin-top: 3px">
              Failed
            </p>
          </div>
        </div>

        <div id="txnListContainer">
          <div style="display: flex; justify-content: center; padding: 40px 0">
            <div class="spinner"></div>
          </div>
        </div>
      </main>
    </div>

    <script src="../js/app.js"></script>
    <script>
      // Session guard
      if (sessionStorage.getItem("authenticated") !== "true") {
        window.location.href = "login.html";
      }

      const methodIcon = (method) =>
        method === "card"
          ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>`
          : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="3" height="3"/></svg>`;

      const badgeFor = (status) => {
        if (status === "success")
          return `<span class="badge badge-success">✓ Approved</span>`;
        if (status === "refunded")
          return `<span class="badge badge-refunded">↩ Refunded</span>`;
        return `<span class="badge badge-failed">✕ Failed</span>`;
      };

      let allTransactions = [];

      // Get date string (YYYY-MM-DD) from ISO timestamp
      function getDateKey(isoString) {
        return new Date(isoString).toISOString().split("T")[0];
      }

      // Format date for display
      function formatDateHeader(dateStr) {
        const d = new Date(dateStr + "T00:00:00");
        const today = new Date();
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);

        const todayStr = today.toISOString().split("T")[0];
        const yesterdayStr = yesterday.toISOString().split("T")[0];

        if (dateStr === todayStr) return "Today";
        if (dateStr === yesterdayStr) return "Yesterday";
        return d.toLocaleDateString("en-GB", {
          weekday: "short",
          month: "short",
          day: "numeric",
        });
      }

      function applyFilters() {
        const searchTerm = document
          .getElementById("searchRef")
          .value.toLowerCase();
        const dateFrom = document.getElementById("dateFrom").value;
        const dateTo = document.getElementById("dateTo").value;

        let filtered = allTransactions.filter((t) => {
          // Reference search
          if (searchTerm && !t.reference.toLowerCase().includes(searchTerm)) {
            return false;
          }

          // Date range filter
          const txnDate = getDateKey(t.timestamp);
          if (dateFrom && txnDate < dateFrom) return false;
          if (dateTo && txnDate > dateTo) return false;

          return true;
        });

        renderTransactions(filtered);
      }

      function renderTransactions(transactions) {
        const container = document.getElementById("txnListContainer");

        if (transactions.length === 0) {
          container.innerHTML = `
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <p>No transactions found</p>
            <p style="font-size:12px">Try adjusting your filters</p>
          </div>`;
          return;
        }

        // Group by date
        const grouped = {};
        transactions.forEach((t) => {
          const dateKey = getDateKey(t.timestamp);
          if (!grouped[dateKey]) {
            grouped[dateKey] = [];
          }
          grouped[dateKey].push(t);
        });

        // Sort dates descending (newest first)
        const sortedDates = Object.keys(grouped).sort().reverse();

        // Build HTML with daily grouping
        let html = "";
        sortedDates.forEach((dateKey) => {
          html += `<div class="txn-day-group">
            <p class="txn-day-header">${formatDateHeader(dateKey)}</p>
            <div class="txn-list">`;

          grouped[dateKey].forEach((t) => {
            html += `
              <a href="transaction-detail.html?id=${t.id}" class="txn-item">
                <div class="txn-left">
                  <div class="txn-method-icon">${methodIcon(t.payment_method)}</div>
                  <div>
                    <p class="txn-ref">${t.reference}</p>
                    <p class="txn-time">${formatTime(t.timestamp)}</p>
                  </div>
                </div>
                <div class="txn-right">
                  <p class="txn-amount">${formatAmount(t.amount)}</p>
                  ${badgeFor(t.status)}
                </div>
              </a>`;
          });

          html += `</div></div>`;
        });

        container.innerHTML = html;
      }

      async function loadTransactions() {
        try {
          allTransactions = await api.getTransactions();

          // Summary counts (on full data)
          const total = allTransactions.length;
          const approved = allTransactions.filter(
            (t) => t.status === "success",
          ).length;
          const refunded = allTransactions.filter(
            (t) => t.status === "refunded",
          ).length;
          const failed = allTransactions.filter(
            (t) => t.status === "failed",
          ).length;

          document.getElementById("totalCount").textContent = total;
          document.getElementById("approvedCount").textContent = approved;
          document.getElementById("refundedCount").textContent = refunded;
          document.getElementById("failedCount").textContent = failed;

          // Initial render
          renderTransactions(allTransactions);

          // Set date inputs to today by default
          const today = new Date().toISOString().split("T")[0];
          document.getElementById("dateTo").value = today;

          // Add filter listeners
          document
            .getElementById("searchRef")
            .addEventListener("input", applyFilters);
          document
            .getElementById("dateFrom")
            .addEventListener("change", applyFilters);
          document
            .getElementById("dateTo")
            .addEventListener("change", applyFilters);
          document.getElementById("resetBtn").addEventListener("click", () => {
            document.getElementById("searchRef").value = "";
            document.getElementById("dateFrom").value = "";
            document.getElementById("dateTo").value = today;
            renderTransactions(allTransactions);
          });
        } catch {
          document.getElementById("txnListContainer").innerHTML = `
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
          <p>Could not load transactions</p>
          <p style="font-size:12px">Check your connection and refresh</p>
        </div>`;
        }
      }

      document.getElementById("logoutBtn").addEventListener("click", () => {
        sessionStorage.removeItem("authenticated");
        sessionStorage.clear();
        window.location.href = "login.html";
      });

      loadTransactions();
    </script>
  </body>
</html>
