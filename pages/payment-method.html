<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimplePOS – Payment Method</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="logo">
          <span class="logo-name">SimplePOS</span>
          <span class="logo-merchant merchant-name">Loading...</span>
        </div>
      </header>

      <main class="app-main">
        <div>
          <a href="../index.html" class="back-btn">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="15 18 9 12 15 6" />
            </svg>
            Back
          </a>
          <p class="page-title">Payment Method</p>
          <p class="page-subtitle">How would the customer like to pay?</p>
        </div>

        <div class="amount-strip">
          <span class="strip-label">Amount</span>
          <span class="strip-amount" id="amountStrip">£0.00</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 14px">
          <a href="card-payment.html" class="method-card" id="cardBtn">
            <div class="method-icon">
              <svg
                width="28"
                height="28"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#00C2A8"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="1" y="4" width="22" height="16" rx="2" />
                <line x1="1" y1="10" x2="23" y2="10" />
              </svg>
            </div>
            <div class="method-info">
              <p class="method-title">Debit Card</p>
              <p class="method-desc">Customer taps or inserts their card</p>
            </div>
            <svg
              style="margin-left: auto; color: var(--muted)"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </a>

          <a href="qr-payment.html" class="method-card" id="qrBtn">
            <div class="method-icon">
              <svg
                width="28"
                height="28"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#00C2A8"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="3" width="7" height="7" />
                <rect x="14" y="3" width="7" height="7" />
                <rect x="3" y="14" width="7" height="7" />
                <rect x="14" y="14" width="3" height="3" />
                <rect x="19" y="14" width="2" height="2" />
                <rect x="14" y="19" width="2" height="2" />
                <rect x="18" y="18" width="3" height="3" />
              </svg>
            </div>
            <div class="method-info">
              <p class="method-title">QR Code</p>
              <p class="method-desc">Customer scans a QR code to pay</p>
            </div>
            <svg
              style="margin-left: auto; color: var(--muted)"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </a>
        </div>
      </main>
    </div>

    <script src="../js/app.js"></script>
    <script>
      const amount = session.get("pendingAmount");
      if (!amount) {
        window.location.href = "../index.html";
      }

      document.getElementById("amountStrip").textContent = formatAmount(amount);

      document.getElementById("cardBtn").addEventListener("click", (e) => {
        session.set("paymentMethod", "card");
      });

      document.getElementById("qrBtn").addEventListener("click", (e) => {
        session.set("paymentMethod", "qr");
      });
    </script>
  </body>
</html>
