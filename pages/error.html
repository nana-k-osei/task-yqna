<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimplePOS – Payment Failed</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      .error-icon {
        animation: shake 0.4s ease forwards;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-6px);
        }
        40% {
          transform: translateX(6px);
        }
        60% {
          transform: translateX(-4px);
        }
        80% {
          transform: translateX(4px);
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="logo">
          <span class="logo-name">SimplePOS</span>
          <span class="logo-merchant merchant-name">Loading...</span>
        </div>
      </header>

      <main class="app-main">
        <div class="status-screen" style="padding: 24px 0 0">
          <div class="status-icon error error-icon">
            <svg
              width="44"
              height="44"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#FF4D4F"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </div>
          <div>
            <p class="status-title">Payment Failed</p>
            <p class="status-subtitle" id="errorReason">
              The payment could not be completed.
            </p>
          </div>
        </div>

        <div class="card" style="background: #fff8f8; border-color: #ffd6d6">
          <div style="display: flex; gap: 12px; align-items: flex-start">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#FF4D4F"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="flex-shrink: 0; margin-top: 1px"
            >
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="8" x2="12" y2="12" />
              <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            <div>
              <p style="font-size: 14px; font-weight: 600; color: #cc3333">
                What happened?
              </p>
              <p
                style="
                  font-size: 13px;
                  color: #aa4444;
                  margin-top: 4px;
                  line-height: 1.6;
                "
                id="errorDetail"
              >
                The payment was declined. Please check the details and try
                again.
              </p>
            </div>
          </div>
        </div>

        <button class="btn btn-primary btn-large" id="retryBtn">
          Try Again
        </button>

        <button class="btn btn-secondary" id="newPaymentBtn">
          New Payment
        </button>
      </main>
    </div>

    <script src="../js/app.js"></script>
    <script>
      // Session guard
      if (sessionStorage.getItem("authenticated") !== "true") {
        window.location.href = "login.html";
      }

      const reason =
        session.get("errorReason") || "The payment could not be completed.";
      const amount = session.get("pendingAmount");
      const method = session.get("paymentMethod");

      document.getElementById("errorReason").textContent = reason;

      // Provide a more descriptive explanation per error type
      const details = {
        "Invalid amount":
          "A payment of £0 cannot be processed. Please go back and enter a valid amount.",
        "Transaction limit exceeded":
          "Payments above £5,000 are not permitted per transaction. Please split the payment or use an alternative method.",
        "QR code expired. Please start a new payment.":
          "The customer did not scan the QR code within 30 seconds. Please initiate a new payment.",
        "Connection lost. Please try again.":
          "Could not reach the payment server. Check your internet connection and retry.",
      };

      document.getElementById("errorDetail").textContent =
        details[reason] || reason;

      document.getElementById("retryBtn").addEventListener("click", () => {
        // Go back to correct payment screen
        if (method === "qr") {
          window.location.href = "qr-payment.html";
        } else {
          window.location.href = "card-payment.html";
        }
      });

      document.getElementById("newPaymentBtn").addEventListener("click", () => {
        session.clear(
          "pendingAmount",
          "paymentMethod",
          "lastTransaction",
          "errorReason",
        );
        window.location.href = "../index.html";
      });
    </script>
  </body>
</html>
