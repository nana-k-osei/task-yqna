<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimplePOS – QR Payment</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="logo">
          <span class="logo-name">SimplePOS</span>
          <span class="logo-merchant merchant-name">Loading...</span>
        </div>
      </header>

      <main class="app-main">
        <div>
          <p class="page-title">QR Payment</p>
          <p class="page-subtitle">Show the QR code to the customer</p>
        </div>

        <div class="amount-strip">
          <span class="strip-label">Amount</span>
          <span class="strip-amount" id="amountStrip">£0.00</span>
        </div>

        <div
          class="card"
          style="
            align-items: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
          "
        >
          <div class="qr-wrapper">
            <div class="qr-box">
              <!-- Simple SVG QR pattern (decorative) -->
              <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Top-left finder -->
                <rect
                  x="5"
                  y="5"
                  width="25"
                  height="25"
                  fill="none"
                  stroke="#1B2B4B"
                  stroke-width="3"
                />
                <rect x="11" y="11" width="13" height="13" fill="#1B2B4B" />
                <!-- Top-right finder -->
                <rect
                  x="70"
                  y="5"
                  width="25"
                  height="25"
                  fill="none"
                  stroke="#1B2B4B"
                  stroke-width="3"
                />
                <rect x="76" y="11" width="13" height="13" fill="#1B2B4B" />
                <!-- Bottom-left finder -->
                <rect
                  x="5"
                  y="70"
                  width="25"
                  height="25"
                  fill="none"
                  stroke="#1B2B4B"
                  stroke-width="3"
                />
                <rect x="11" y="76" width="13" height="13" fill="#1B2B4B" />
                <!-- Data dots pattern -->
                <rect x="35" y="5" width="5" height="5" fill="#1B2B4B" />
                <rect x="45" y="5" width="5" height="5" fill="#1B2B4B" />
                <rect x="55" y="5" width="5" height="5" fill="#1B2B4B" />
                <rect x="35" y="15" width="5" height="5" fill="#1B2B4B" />
                <rect x="55" y="15" width="5" height="5" fill="#1B2B4B" />
                <rect x="45" y="25" width="5" height="5" fill="#1B2B4B" />
                <rect x="35" y="35" width="5" height="5" fill="#1B2B4B" />
                <rect x="55" y="35" width="5" height="5" fill="#1B2B4B" />
                <rect x="5" y="35" width="5" height="5" fill="#1B2B4B" />
                <rect x="15" y="35" width="5" height="5" fill="#1B2B4B" />
                <rect x="25" y="35" width="5" height="5" fill="#1B2B4B" />
                <rect x="5" y="45" width="5" height="5" fill="#1B2B4B" />
                <rect x="25" y="45" width="5" height="5" fill="#1B2B4B" />
                <rect x="45" y="45" width="5" height="5" fill="#1B2B4B" />
                <rect x="65" y="45" width="5" height="5" fill="#1B2B4B" />
                <rect x="85" y="45" width="5" height="5" fill="#1B2B4B" />
                <rect x="5" y="55" width="5" height="5" fill="#1B2B4B" />
                <rect x="15" y="55" width="5" height="5" fill="#1B2B4B" />
                <rect x="35" y="55" width="5" height="5" fill="#1B2B4B" />
                <rect x="55" y="55" width="5" height="5" fill="#1B2B4B" />
                <rect x="75" y="55" width="5" height="5" fill="#1B2B4B" />
                <rect x="65" y="65" width="5" height="5" fill="#1B2B4B" />
                <rect x="85" y="65" width="5" height="5" fill="#1B2B4B" />
                <rect x="45" y="75" width="5" height="5" fill="#1B2B4B" />
                <rect x="55" y="85" width="5" height="5" fill="#1B2B4B" />
                <rect x="75" y="75" width="5" height="5" fill="#1B2B4B" />
                <rect x="85" y="85" width="5" height="5" fill="#1B2B4B" />
                <rect x="65" y="85" width="5" height="5" fill="#1B2B4B" />
                <!-- SimplePOS label in center -->
                <rect
                  x="38"
                  y="38"
                  width="24"
                  height="24"
                  rx="4"
                  fill="white"
                />
                <text
                  x="50"
                  y="53"
                  text-anchor="middle"
                  font-family="sans-serif"
                  font-size="7"
                  font-weight="bold"
                  fill="#1B2B4B"
                >
                  Simple
                </text>
              </svg>
            </div>

            <p style="font-size: 13px; color: var(--muted); text-align: center">
              Ask the customer to scan this code with their banking app
            </p>
          </div>

          <div
            style="
              display: flex;
              align-items: center;
              gap: 16px;
              width: 100%;
              justify-content: center;
            "
          >
            <div class="countdown-ring">
              <svg viewBox="0 0 64 64">
                <circle class="ring-bg" cx="32" cy="32" r="28" />
                <circle
                  class="ring-progress"
                  id="ringProgress"
                  cx="32"
                  cy="32"
                  r="28"
                  stroke-dasharray="175.9"
                  stroke-dashoffset="0"
                />
              </svg>
              <div class="countdown-number" id="countdownNumber">30</div>
            </div>
            <div>
              <p
                style="
                  font-family: &quot;Syne&quot;, sans-serif;
                  font-weight: 700;
                  font-size: 15px;
                  color: var(--navy);
                "
              >
                Waiting for scan
              </p>
              <p style="font-size: 13px; color: var(--muted); margin-top: 3px">
                Code expires in <span id="countdownText">30</span>s
              </p>
            </div>
          </div>
        </div>

        <button class="btn btn-primary" id="confirmBtn">
          Confirm Scan Complete
        </button>
        <button class="btn btn-secondary" id="cancelBtn">Cancel Payment</button>
      </main>
    </div>

    <script src="../js/app.js"></script>
    <script>
      const amount = session.get("pendingAmount");
      const method = session.get("paymentMethod");

      if (!amount || method !== "qr") {
        window.location.href = "../index.html";
      }

      document.getElementById("amountStrip").textContent = formatAmount(amount);

      const TOTAL = 30;
      let timeLeft = TOTAL;
      let expired = false;
      let confirmed = false;

      const ring = document.getElementById("ringProgress");
      const countNum = document.getElementById("countdownNumber");
      const countText = document.getElementById("countdownText");
      const confirmBtn = document.getElementById("confirmBtn");
      const cancelBtn = document.getElementById("cancelBtn");
      const circumference = 175.9;

      const timer = setInterval(() => {
        timeLeft--;
        countNum.textContent = timeLeft;
        countText.textContent = timeLeft;

        const offset = circumference * (1 - timeLeft / TOTAL);
        ring.style.strokeDashoffset = offset;

        if (timeLeft <= 10) ring.style.stroke = "#FF4D4F";
        if (timeLeft <= 5) countNum.style.color = "#FF4D4F";

        if (timeLeft <= 0) {
          clearInterval(timer);
          expired = true;
          confirmBtn.disabled = true;
          session.set(
            "errorReason",
            "QR code expired. Please start a new payment.",
          );
          window.location.href = "error.html";
        }
      }, 1000);

      confirmBtn.addEventListener("click", async () => {
        if (expired || confirmed) return;
        confirmed = true;
        clearInterval(timer);
        confirmBtn.disabled = true;
        cancelBtn.disabled = true;
        confirmBtn.textContent = "Processing...";

        try {
          const txn = await api.createPayment(amount, "qr");
          session.set("lastTransaction", txn);
          if (txn.status === "success") {
            window.location.href = "success.html";
          } else {
            session.set("errorReason", txn.failure_reason);
            window.location.href = "error.html";
          }
        } catch {
          session.set("errorReason", "Connection lost. Please try again.");
          window.location.href = "error.html";
        }
      });

      cancelBtn.addEventListener("click", () => {
        clearInterval(timer);
        window.location.href = "../index.html";
      });
    </script>
  </body>
</html>
