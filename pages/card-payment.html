<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimplePOS – Card Payment</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="logo">
          <span class="logo-name">SimplePOS</span>
          <span class="logo-merchant merchant-name">Loading...</span>
        </div>
      </header>

      <main class="app-main">
        <div>
          <a href="payment-method.html" class="back-btn" id="backBtn">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="15 18 9 12 15 6" />
            </svg>
            Back
          </a>
          <p class="page-title">Card Payment</p>
          <p class="page-subtitle">Waiting for customer card</p>
        </div>

        <div class="amount-strip">
          <span class="strip-label">Amount</span>
          <span class="strip-amount" id="amountStrip">£0.00</span>
        </div>

        <div class="card">
          <div class="card-wait">
            <div class="pulse-ring">
              <div class="card-icon-center">
                <svg
                  width="32"
                  height="32"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#00C2A8"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="1" y="4" width="22" height="16" rx="2" />
                  <line x1="1" y1="10" x2="23" y2="10" />
                </svg>
              </div>
            </div>
            <div style="text-align: center">
              <p
                style="
                  font-family: &quot;Syne&quot;, sans-serif;
                  font-weight: 700;
                  font-size: 17px;
                  color: var(--navy);
                "
              >
                Tap or Insert Card
              </p>
              <p style="font-size: 13px; color: var(--muted); margin-top: 6px">
                Ask the customer to present their card to the reader
              </p>
            </div>
            <div
              style="
                display: flex;
                gap: 10px;
                align-items: center;
                background: var(--bg);
                border-radius: 10px;
                padding: 12px 18px;
              "
            >
              <div
                id="processingDot"
                style="
                  width: 10px;
                  height: 10px;
                  border-radius: 50%;
                  background: var(--teal);
                  animation: blink 1.2s ease-in-out infinite;
                "
              ></div>
              <span
                style="font-size: 13px; font-weight: 500; color: var(--muted)"
                id="statusText"
                >Waiting for card...</span
              >
            </div>
          </div>
        </div>

        <button class="btn btn-secondary" id="cancelBtn">Cancel Payment</button>
      </main>
    </div>

    <style>
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.2;
        }
      }
    </style>

    <script src="../js/app.js"></script>
    <script>
      // Session guard
      if (sessionStorage.getItem("authenticated") !== "true") {
        window.location.href = "login.html";
      }

      const amount = session.get("pendingAmount");
      const method = session.get("paymentMethod");

      if (!amount || method !== "card") {
        window.location.href = "../index.html";
      }

      document.getElementById("amountStrip").textContent = formatAmount(amount);

      let cancelled = false;

      document.getElementById("cancelBtn").addEventListener("click", () => {
        cancelled = true;
        window.location.href = "../index.html";
      });

      document.getElementById("backBtn").addEventListener("click", () => {
        cancelled = true;
      });

      // Simulate card tap delay (2.5 seconds) then process
      async function processCardPayment() {
        await new Promise((r) => setTimeout(r, 2500));
        if (cancelled) return;

        document.getElementById("statusText").textContent = "Processing...";
        document.getElementById("cancelBtn").disabled = true;
        document.getElementById("backBtn").style.pointerEvents = "none";

        try {
          const txn = await api.createPayment(amount, "card");
          session.set("lastTransaction", txn);
          if (txn.status === "success") {
            window.location.href = "success.html";
          } else {
            session.set("errorReason", txn.failure_reason);
            window.location.href = "error.html";
          }
        } catch {
          session.set("errorReason", "Connection lost. Please try again.");
          window.location.href = "error.html";
        }
      }

      processCardPayment();
    </script>
  </body>
</html>
